name: "Publish Tauri App"
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Windows-x86_64
  windows-x86_64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable # They use branch based releases
      - name: Install cinny dependencies
        run: cd cinny && npm ci
      - name: Install tauri dependencies
        run: npm ci
      - name: Build desktop app with Tauri
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
        with:
          # 让 action 把更新包(.sig/.zip)和 latest.json 传到 release,自动更新才有得查
          tagName: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NODE_OPTIONS: "--max_old_space_size=4096"
      - name: Get app version (windows)
        run: |
          $json = (Get-Content "src-tauri\tauri.conf.json" -Raw) | ConvertFrom-Json
          $version = $json.version
          echo "Version: ${version}"
          echo "TAURI_VERSION=${version}" >> $Env:GITHUB_ENV
          echo "${Env:TAURI_VERSION}"
        shell: pwsh
      - name: Move msi
        run: |
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*_x64_en-US.msi" | Select-Object -First 1
          if ($msi) { Move-Item $msi.FullName "src-tauri\target\release\bundle\msi\Siyu_desktop-x86_64.msi" }
        shell: pwsh
      - name: Upload tagged release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/Siyu_desktop-x86_64.msi

  # Android (APK) - 暂时禁用，单独调试
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Setup Java
        uses: actions/setup-java@v4 # v5.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973"
      - name: Install cinny dependencies
        run: cd cinny && npm ci
      - name: Install tauri dependencies
        run: npm ci
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Init Android project (first run)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx shx cp config.json cinny/ && tauri android init
          fi
          cp src-tauri/google-services.json src-tauri/gen/android/app/google-services.json
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      - name: Inject Firebase into Android Gradle files
        run: |
          项目级 build.gradle：加 google-services 插件
          PG="src-tauri/gen/android/build.gradle"
          if ! grep -q "com.google.gms.google-services" "$PG"; then
            sed -i "s|id 'com.android.application' version|id 'com.google.gms.google-services' version '4.5.0' apply false\n  id 'com.android.application' version|" "$PG"
          fi
          应用级 build.gradle：应用插件 + Firebase BoM + messaging
          AG="src-tauri/gen/android/app/build.gradle"
          if ! grep -q "com.google.gms.google-services" "$AG"; then
            sed -i "s|id 'com.android.application'|id 'com.android.application'\n  id 'com.google.gms.google-services'|" "$AG"
          fi
          if ! grep -q "firebase-bom" "$AG"; then
            sed -i "s|^dependencies {|dependencies {\n  implementation platform('com.google.firebase:firebase-bom:35.0.2')\n  implementation 'com.google.firebase:firebase-messaging'|" "$AG"
          fi
          echo "--- project build.gradle plugins ---"
          grep -A3 "plugins {" "$PG" | head -8
      - name: Build Android APK
        run: |
          npx shx cp config.json cinny/ && tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          NODE_OPTIONS: "--max_old_space_size=4096"
      - name: Upload APK to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
