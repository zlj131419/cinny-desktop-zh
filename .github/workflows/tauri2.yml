name: "Publish Tauri App"
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Windows-x86_64 (formal releases only; skipped for prereleases used in Android iteration)
  windows-x86_64:
    if: github.event.release.prerelease == false
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable # They use branch based releases
      - name: Sync version from git tag
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $conf = "src-tauri\tauri.conf.json"
          $json = (Get-Content $conf -Raw) | ConvertFrom-Json
          $json.version = $tag
          $json | ConvertTo-Json -Depth 10 | Set-Content $conf -Encoding UTF8
          echo "Synced tauri.conf.json version to: ${tag}"
        shell: pwsh
      - name: Install cinny dependencies
        run: cd cinny && npm ci
      - name: Install tauri dependencies
        run: npm ci
      - name: Build desktop app with Tauri
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
        with:
          # 让 action 把更新包(.sig/.zip)和 latest.json 传到 release,自动更新才有得查
          tagName: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NODE_OPTIONS: "--max_old_space_size=4096"
      - name: Get app version (windows)
        run: |
          $json = (Get-Content "src-tauri\tauri.conf.json" -Raw) | ConvertFrom-Json
          $version = $json.version
          echo "Version: ${version}"
          echo "TAURI_VERSION=${version}" >> $Env:GITHUB_ENV
          echo "${Env:TAURI_VERSION}"
        shell: pwsh
      - name: Move msi
        run: |
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*_x64_en-US.msi" | Select-Object -First 1
          if ($msi) { Move-Item $msi.FullName "src-tauri\target\release\bundle\msi\Siyu_desktop-x86_64.msi" }
        shell: pwsh
      - name: Upload tagged release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/Siyu_desktop-x86_64.msi

  # Android (APK)
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Setup Java
        uses: actions/setup-java@v4 # v5.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup NDK
        run: |
          ls $ANDROID_HOME/ndk/
          NDK_VER=$(ls $ANDROID_HOME/ndk/ | sort -V | tail -1)
          echo "NDK_VER=$NDK_VER" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "Using NDK $NDK_VER at $ANDROID_HOME/ndk/$NDK_VER"
      - name: Install cinny dependencies
        run: cd cinny && npm ci
      - name: Install tauri dependencies
        run: npm ci
      - name: Init Android project (first run)
        run: |
          set -x
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "NDK_HOME=$NDK_HOME"
            echo "JAVA_HOME=$JAVA_HOME"
            npx tauri --version
            ls "$ANDROID_HOME/ndk/" || echo "no ndk dir"
            ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "no build-tools"
            ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "no platforms"
            npx shx cp config.json cinny/
            echo "config.json copied"
            npx tauri android init
            echo "init exit: $?"
            # Fix Kotlin metadata version: Firebase libs use Kotlin 2.1.0, template uses 1.9.x
            # Patch version catalog if present (Tauri template uses libs.versions.toml)
            if [ -f "src-tauri/gen/android/gradle/libs.versions.toml" ]; then
              echo "Patching libs.versions.toml"
              sed -i -E 's/^kotlin *= *"[^"]+"/kotlin = "2.1.0"/' src-tauri/gen/android/gradle/libs.versions.toml || true
              grep -i kotlin src-tauri/gen/android/gradle/libs.versions.toml | head -5
            fi
            for f in src-tauri/gen/android/build.gradle.kts src-tauri/gen/android/app/build.gradle.kts; do
              if [ -f "$f" ]; then
                echo "Patching $f"
                # Replace kotlin version 1.9.x with 2.1.0
                sed -i -E 's/(kotlin[^"]*"[^"]*version[^"]*")[0-9]+\.[0-9]+\.[0-9]+/\12.1.0/g' "$f" || true
                sed -i -E 's/id\("org\.jetbrains\.kotlin\.android"\) version "[0-9.]+"/id("org.jetbrains.kotlin.android") version "2.1.0"/g' "$f" || true
                # Safety net: skip Kotlin metadata version check (Firebase libs are 2.1.0)
                if ! grep -q "Xskip-metadata-version-check" "$f"; then
                  printf '\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {\n    kotlinOptions.freeCompilerArgs += "-Xskip-metadata-version-check"\n}\n' >> "$f"
                fi
              fi
            done
            ls -la src-tauri/gen/android/ 2>&1 | head -10
            # Siyu fix 1: regenerate launcher icons from our logo (template ships old defaults)
            echo "Regenerating Android icons from src-tauri/icons/icon.png"
            npx tauri icon src-tauri/icons/icon.png 2>&1 | tail -3 || echo "tauri icon failed, continuing"
            # Siyu fix 2: allow cleartext for the local app server (ERR_CLEARTEXT_NOT_PERMITTED)
            MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
            if [ -f "$MANIFEST" ]; then
              # Tauri template ships usesCleartextTraffic="false": flip the value to true
              sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/' "$MANIFEST" || true
              if ! grep -q 'usesCleartextTraffic="true"' "$MANIFEST"; then
                sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST" || true
              fi
              echo "cleartext now:"; grep -o 'usesCleartextTraffic="[^"]*"' "$MANIFEST" | head -1
            fi
            # Sync Android versionName/versionCode from tauri.conf.json (template defaults to 1.0/1)
            python3 -c "import json,re; ver=json.load(open('src-tauri/tauri.conf.json'))['version']; code=int(ver.replace('.','')); p='src-tauri/gen/android/app/build.gradle.kts'; s=open(p).read(); s=re.sub(r'versionName = \"[^\"]*\"','versionName = \"'+ver+'\"',s); s=re.sub(r'versionCode = [0-9]+','versionCode = '+str(code),s); open(p,'w').write(s); print('android version synced:',ver,code)" || echo "version sync skipped"
          } 2>&1 | tee /tmp/android-init.log
          tail -50 /tmp/android-init.log
          grep -q "^init exit: 0$" /tmp/android-init.log || { echo "tauri android init FAILED"; exit 1; }
      - name: Upload init log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-init-log
          path: /tmp/android-init.log
      - name: Copy google-services.json
        if: success()
        run: cp src-tauri/google-services.json src-tauri/gen/android/app/google-services.json
      - name: Inject Firebase into Android Gradle files
        run: |
          python3 - <<'PYEOF_INJECT'
          import re, sys

          def find_block(src, name, start=0):
              """return (open_line_end, close_pos) of first top-level 'name {' block"""
              m = re.search(r'^([ \t]*)' + re.escape(name) + r'\s*\{\s*$', src[start:], re.M)
              if not m:
                  return None
              indent, open_end = m.group(1), start + m.end()
              depth, i = 1, open_end
              in_str = None
              while i < len(src) and depth > 0:
                  c = src[i]
                  if in_str:
                      if c == in_str and src[i-1] != '\\':
                          in_str = None
                  elif c in ('"', "'"):
                      in_str = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                  i += 1
              return (indent, open_end, i)

          def inject_nested(path, outer, inner, line, guard):
              with open(path) as f:
                  src = f.read()
              if guard in src:
                  print(f"{path}: already has {guard}, skipping")
                  return
              ob = find_block(src, outer)
              if not ob:
                  print(f"{path}: no '{outer}' block"); sys.exit(1)
              o_indent, o_open, o_close = ob
              ib = find_block(src, inner, o_open)
              if not ib or ib[2] > o_close:
                  print(f"{path}: no '{inner}' block inside '{outer}'"); sys.exit(1)
              i_indent, i_open, i_close = ib
              addition = i_indent + "    " + line + "\n"
              src = src[:i_open] + "\n" + addition + src[i_open:]
              with open(path, "w") as f:
                  f.write(src)
              print(f"{path}: injected {guard}")

          def inject_top(path, block, line, guard):
              with open(path) as f:
                  src = f.read()
              if guard in src:
                  print(f"{path}: already has {guard}, skipping")
                  return
              b = find_block(src, block)
              if not b:
                  print(f"{path}: no '{block}' block"); sys.exit(1)
              indent, open_end, close_pos = b
              addition = indent + "    " + line + "\n"
              src = src[:open_end] + "\n" + addition + src[open_end:]
              with open(path, "w") as f:
                  f.write(src)
              print(f"{path}: injected {guard}")

          proj = "src-tauri/gen/android/build.gradle.kts"
          app = "src-tauri/gen/android/app/build.gradle.kts"

          # project: buildscript.dependencies += google-services classpath
          inject_nested(proj, "buildscript", "dependencies",
                        'classpath("com.google.gms:google-services:4.5.0")',
                        "com.google.gms:google-services")
          # app: plugins += google-services
          inject_top(app, "plugins",
                     'id("com.google.gms.google-services")',
                     "com.google.gms.google-services")
          # app: dependencies += firebase bom + messaging
          inject_top(app, "dependencies",
                     'implementation(platform("com.google.firebase:firebase-bom:35.0.2"))\n    implementation("com.google.firebase:firebase-messaging")',
                     "firebase-bom")
          PYEOF_INJECT
          echo "--- project buildscript deps ---"
          grep -B2 -A4 "google-services" src-tauri/gen/android/build.gradle.kts | head -12
          echo "--- app plugins/deps ---"
          grep -A8 "^plugins {" src-tauri/gen/android/app/build.gradle.kts | head -10
      - name: Apply Android release fixes (version + cleartext)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "--- BEFORE ---"
          grep -n "versionName\|versionCode\|usesCleartextTraffic" src-tauri/gen/android/app/build.gradle.kts src-tauri/gen/android/app/src/main/AndroidManifest.xml || true
          TAG="$TAG" python3 - <<'PYEOF_FIX'
          import glob, json, os, re
          ver = os.environ.get('TAG') or json.load(open('src-tauri/tauri.conf.json'))['version']
          code = int(ver.replace('.', ''))
          app = 'src-tauri/gen/android/app/build.gradle.kts'
          s = open(app).read()
          # version lives in tauri.properties (getProperty defaults are the fallback): patch both channels
          s = re.sub(r'(tauri\.android\.versionName",\s*")[^"]*(")', r'\g<1>%s\g<2>' % ver, s)
          s = re.sub(r'(tauri\.android\.versionCode",\s*")[^"]*(")', r'\g<1>%d\g<2>' % code, s)
          s = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "%s"' % ver, s)
          s = re.sub(r'versionCode\s*=\s*[0-9]+', 'versionCode = %d' % code, s)
          s = re.sub(r'(usesCleartextTraffic"\]\s*=\s*)"false"', r'\1"true"', s)
          open(app, 'w').write(s)
          props = glob.glob('src-tauri/gen/android/**/tauri.properties', recursive=True)
          if not props:
              props = ['src-tauri/gen/android/app/tauri.properties']
          for p in props:
              lines = []
              if os.path.exists(p):
                  lines = [l for l in open(p).read().splitlines()
                           if not l.startswith('tauri.android.versionName') and not l.startswith('tauri.android.versionCode')]
              lines.append('tauri.android.versionName=%s' % ver)
              lines.append('tauri.android.versionCode=%d' % code)
              open(p, 'w').write('\n'.join(lines) + '\n')
              print('tauri.properties updated:', p)
          
          man = 'src-tauri/gen/android/app/src/main/AndroidManifest.xml'
          m = open(man).read()
          m = m.replace('android:usesCleartextTraffic="${usesCleartextTraffic}"', 'android:usesCleartextTraffic="true"')
          m = m.replace('android:usesCleartextTraffic="false"', 'android:usesCleartextTraffic="true"')
          if 'usesCleartextTraffic' not in m:
              m = m.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          # 录音权限：语音消息需要 RECORD_AUDIO（WebView getUserMedia 的前置）
          # MODIFY_AUDIO_SETTINGS 必须一并声明：wry 的 RustWebChromeClient 在
          # onPermissionRequest 里对 AUDIO_CAPTURE 固定申请 [MODIFY_AUDIO_SETTINGS,
          # RECORD_AUDIO] 两个权限，缺任何一个（未在清单声明）整单被系统秒拒，
          # getUserMedia 直接 NotAllowedError 且不弹框——1.0.41 就栽在这里
          if 'RECORD_AUDIO' not in m:
              m = m.replace('<application', '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="com.huawei.android.launcher.permission.CHANGE_BADGE" />\n    <application', 1)
          # 键盘避让：MainActivity 必须声明 adjustResize，键盘弹起时系统才把窗口
          # 缩到键盘上方；1.0.42 成品清单实测未声明，输入框被键盘直接盖住。
          if 'windowSoftInputMode' not in m:
              import re as _re
              m2, nsub = _re.subn(r'(<activity[^>]*MainActivity[^>]*?)(\s*/?>)', r'\1 android:windowSoftInputMode="adjustResize"\2', m, count=1)
              if nsub:
                  m = m2
          open(man, 'w').write(m)
          print('release fixes applied:', ver, code)
          PYEOF_FIX
          echo "--- AFTER ---"
          grep -n "versionName\|versionCode\|usesCleartextTraffic" src-tauri/gen/android/app/build.gradle.kts src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -rn "tauri.android.versionName" src-tauri/gen/android/app/build.gradle.kts src-tauri/gen/android/app/tauri.properties || true
          { grep -q "tauri.android.versionName\", \"$TAG\"" src-tauri/gen/android/app/build.gradle.kts || grep -q "tauri.android.versionName=$TAG" src-tauri/gen/android/app/tauri.properties; } || { echo "VERSION FIX DID NOT LAND"; exit 1; }
          grep -q 'usesCleartextTraffic="true"' src-tauri/gen/android/app/src/main/AndroidManifest.xml || { echo "CLEARTEXT FIX DID NOT LAND"; exit 1; }
          grep -q 'android.permission.RECORD_AUDIO' src-tauri/gen/android/app/src/main/AndroidManifest.xml || { echo "RECORD_AUDIO DID NOT LAND"; exit 1; }
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' src-tauri/gen/android/app/src/main/AndroidManifest.xml || { echo "MODIFY_AUDIO_SETTINGS DID NOT LAND"; exit 1; }
          grep -q 'com.huawei.android.launcher.permission.CHANGE_BADGE' src-tauri/gen/android/app/src/main/AndroidManifest.xml || { echo "CHANGE_BADGE DID NOT LAND"; exit 1; }
          grep -q 'windowSoftInputMode="adjustResize"' src-tauri/gen/android/app/src/main/AndroidManifest.xml || { echo "SOFT_INPUT_MODE DID NOT LAND"; exit 1; }
      - name: Build Android APK
        run: |
          npx shx cp config.json cinny/ && npx tauri android build --apk --target aarch64
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
      - name: Verify built APK values
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | head -2
            "$AAPT" dump badging "$APK" | grep -q "versionName='$TAG'" || { echo "APK versionName WRONG"; exit 1; }
            LINE=$("$AAPT" dump xmltree --file AndroidManifest.xml "$APK" | grep "usesCleartextTraffic" | head -1)
            echo "cleartext attr: $LINE"
            echo "$LINE" | grep -Eq "=true|0xffffffff" || { echo "APK cleartext NOT true"; exit 1; }
            "$AAPT" dump badging "$APK" | grep -q "android.permission.RECORD_AUDIO" || { echo "APK missing RECORD_AUDIO"; exit 1; }
            "$AAPT" dump badging "$APK" | grep -q "android.permission.MODIFY_AUDIO_SETTINGS" || { echo "APK missing MODIFY_AUDIO_SETTINGS"; exit 1; }
            "$AAPT" dump badging "$APK" | grep -q "com.huawei.android.launcher.permission.CHANGE_BADGE" || { echo "APK missing CHANGE_BADGE"; exit 1; }
            echo "APK values verified OK"
          else
            echo "aapt2 not found, skipping in-CI verification"
          fi
      - name: Install build-tools 29.0.3 (sign action needs zipalign)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;29.0.3"
          ls "$ANDROID_HOME/build-tools/"
      - name: Sign Android APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: src-tauri/gen/android/app/build/outputs/apk/universal/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload APK to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
