  <body id="appBody">
    <div id="siyu-splash" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1b3a 0%,#2d1b4e 50%,#1a2a6c 100%);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">
      <img src="./public/siyu-icon-200.png" alt="私语 Siyu" style="width:96px;height:96px;border-radius:22px;margin-bottom:24px;box-shadow:0 8px 32px rgba(0,0,0,.4);" />
      <div style="font-size:28px;font-weight:800;color:#fff;margin-bottom:12px;letter-spacing:2px;">私语 Siyu</div>
      <div style="font-size:16px;color:rgba(255,255,255,.75);margin-bottom:8px;">聊天，本该如此安全</div>
      <div style="font-size:13px;color:rgba(255,255,255,.5);margin-bottom:32px;max-width:320px;text-align:center;line-height:1.8;">一款属于自己的聊天软件<br/>不收集、不画像、不打扰</div>
      <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:#a78bfa;border-radius:50%;animation:siyu-spin 0.8s linear infinite;"></div>
      <style>@keyframes siyu-spin{to{transform:rotate(360deg);}}</style>
    </div>
    <script>
      // App 加载完成后隐藏闪屏
      window.__hideSiyuSplash = function(){var el=document.getElementById('siyu-splash');if(el){el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(function(){el.remove();},350);}};
      // 兜底：10秒后自动隐藏
      setTimeout(function(){if(document.getElementById('siyu-splash'))window.__hideSiyuSplash();},10000);
    </script>
    <script>
      window.global ||= window;
    </script>
    <div id="root"></div>
    <div id="portalContainer"></div>
    <script type="module" src="./src/index.tsx"></script>
