<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>私语麦克风检测</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 24px 16px; background: #f4f4f5; color: #18181b; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #52525b; font-size: 14px; line-height: 1.6; }
  button { width: 100%; padding: 14px; font-size: 17px; border: 0; border-radius: 12px; background: #2563eb; color: #fff; margin: 16px 0; }
  button:active { opacity: .8; }
  pre { background: #18181b; color: #d4f7d4; padding: 14px; border-radius: 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; min-height: 120px; }
  .ok { color: #22c55e; } .bad { color: #ef4444; }
</style>
</head>
<body>
<h1>私语 · 麦克风检测</h1>
<p>点下面的按钮，本页会逐层检测录音链：录音接口是否存在 → 权限 → 实际调用麦克风。结果发给管理员即可定位卡点。本页独立于 App 版本，随时可用。</p>
<button id="run">开始检测</button>
<pre id="out">尚未检测</pre>
<script>
var out = document.getElementById('out');
function line(s) { out.textContent += (out.textContent === '尚未检测' ? '' : '\n') + s; }
document.getElementById('run').addEventListener('click', async function () {
  out.textContent = '';
  line('环境 UA：' + navigator.userAgent);
  line('页面协议：' + location.protocol + '（麦克风要求 https）');
  line('MediaRecorder 接口：' + (typeof MediaRecorder));
  line('getUserMedia 接口：' + (navigator.mediaDevices ? typeof navigator.mediaDevices.getUserMedia : 'mediaDevices 不存在'));
  var inTauri = '__TAURI__' in window;
  line('运行环境：' + (inTauri ? 'App（Tauri）' : '浏览器/PWA'));
  if (inTauri && window.__TAURI__.core && window.__TAURI__.core.invoke) {
    try {
      var r = await window.__TAURI__.core.invoke('plugin:siyu-keepalive|request_microphone');
      line('App 录音权限命令返回：' + JSON.stringify(r));
    } catch (e) {
      line('App 录音权限命令异常：' + (e && e.message ? e.message : e));
    }
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    line('结论：当前环境没有 getUserMedia，录音不可用（多为旧版 WebView/浏览器或非 https）');
    return;
  }
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    var tracks = stream.getAudioTracks();
    line('getUserMedia：成功，音频轨道 ' + tracks.length + ' 条' + (tracks[0] ? '（' + tracks[0].label + '）' : ''));
    tracks.forEach(function (t) { t.stop(); });
    if (typeof MediaRecorder === 'undefined') {
      line('结论：麦克风能打开，但本环境没有 MediaRecorder，网页版录音条仍不可用（App 内需走原生录音）');
    } else {
      line('结论：麦克风可用，录音链全部通过 ✓');
    }
  } catch (e) {
    line('getUserMedia：失败 ' + (e && e.name ? e.name : '') + ' ' + (e && e.message ? e.message : e));
    if (e && e.name === 'NotAllowedError') line('结论：权限被拒——检查系统设置里本应用/浏览器的麦克风权限；App 还需确认清单含 MODIFY_AUDIO_SETTINGS + RECORD_AUDIO');
    if (e && e.name === 'NotFoundError') line('结论：没有找到麦克风设备');
    if (e && e.name === 'NotReadableError') line('结论：麦克风被其他应用占用或系统拦截');
  }
});
</script>
</body>
</html>
