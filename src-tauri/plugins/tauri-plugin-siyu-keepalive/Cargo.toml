[package]
name = "tauri-plugin-siyu-keepalive"
version = "0.1.0"
edition = "2021"
description = "Siyu: Android foreground-service keep-alive so the app keeps receiving message notifications in background"
license = "AGPL-3.0-only"
links = "tauri-plugin-siyu-keepalive"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
